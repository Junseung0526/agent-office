<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 코딩 에이전트의 작업을 아이소메트릭 사무실로 실시간 시각화하는 대시보드">
  <meta name="theme-color" content="#070a14">
  <meta name="color-scheme" content="dark">
  <title>Agent Office</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b3f8f'/><path d='M8 13h16v12H8z' fill='%23ffffff'/><path d='M6 13l10-6 10 6z' fill='%23ffd58a'/><rect x='11' y='16' width='3' height='3' fill='%233b3f8f'/><rect x='18' y='16' width='3' height='3' fill='%233b3f8f'/><rect x='14.5' y='20' width='3' height='5' fill='%23e8853a'/></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- ============ 왼쪽: 건물 (층 목록) ============ -->
    <aside class="building" aria-label="층 목록">
      <div class="building-roof">
        <span class="roof-antenna" aria-hidden="true"></span>
        <div class="roof-cap">AGENT OFFICE</div>
      </div>

      <div class="building-body">
        <div class="building-tools">
          <label class="floor-search">
            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line></svg>
            <input type="text" id="floorSearchInput" placeholder="층 검색 (/)" aria-label="프로젝트 검색">
            <button type="button" id="floorSearchClear" class="btn-search-clear" title="검색어 지우기" aria-label="검색어 지우기" style="display:none;">✕</button>
          </label>
          <div class="floor-filter-chips" role="group" aria-label="상태 필터">
            <button type="button" class="filter-chip active" data-filter="all">전체 <span class="chip-count" id="countAll">0</span></button>
            <button type="button" class="filter-chip" data-filter="working"><span class="chip-dot dot-working"></span>작업 중 <span class="chip-count" id="countWorking">0</span></button>
            <button type="button" class="filter-chip" data-filter="question"><span class="chip-dot dot-question"></span>답변 대기 <span class="chip-count" id="countQuestion">0</span></button>
          </div>
        </div>
        <div class="floors-list" id="floorsList"></div>
      </div>

      <div class="building-ground" aria-hidden="true">
        <div class="ground-grass"></div>
        <div class="ground-lobby">
          <span class="lobby-door"></span>
          <span class="lobby-sign">LOBBY</span>
        </div>
      </div>
      <div class="building-footer" id="buildingFooter">층 0개</div>
    </aside>

    <!-- ============ 가운데: 사무실 ============ -->
    <main class="stage">
      <canvas id="officeCanvas" role="img" aria-label="사무실 평면도"></canvas>

      <!-- 현재 층 카드 -->
      <div class="stage-card floor-header">
        <span class="floor-header-num" id="currentFloorTag">-</span>
        <div class="floor-header-text">
          <div class="floor-header-title" id="currentProjectTitle">층을 찾는 중...</div>
          <div class="floor-header-sub" id="currentSessionSubtitle"></div>
        </div>
        <span class="session-pill" id="sessionPill">세션 0개</span>
        <span class="engine-pill" id="currentEngineTag">-</span>
      </div>

      <!-- 답변 대기 바로가기 -->
      <button type="button" id="hotJumpBanner" class="hot-jump" style="display:none;" title="답변을 기다리는 층으로 이동 (Tab)">
        <span class="hot-jump-dot" aria-hidden="true"></span>
        <span id="hotJumpText">답변 대기</span>
        <span class="hot-jump-go">이동 →</span>
      </button>

      <!-- 토큰 사용량 카드 -->
      <div class="stage-card usage-card" id="tokenMeterBox" style="display:none;">
        <div class="usage-head">
          <span class="usage-title">토큰</span>
          <span class="usage-model" id="tokenModelBadge">-</span>
        </div>
        <div class="usage-rows">
          <div class="usage-row"><span class="usage-label">입력</span><span class="usage-bar"><i id="tokenInputBar"></i></span><span class="usage-val" id="tokenInputVal">0</span></div>
          <div class="usage-row"><span class="usage-label">출력</span><span class="usage-bar"><i id="tokenOutputBar" class="b-out"></i></span><span class="usage-val" id="tokenOutputVal">0</span></div>
          <div class="usage-row"><span class="usage-label">캐시</span><span class="usage-bar"><i id="tokenCacheBar" class="b-cache"></i></span><span class="usage-val" id="tokenCacheVal">0</span></div>
        </div>
        <div class="usage-foot">
          <span>합계 <b id="tokenTotalVal">0</b></span>
          <span id="tokenBurnRateVal">0/s</span>
          <span id="tokenCostRow" style="display:none;"><b id="tokenCostVal">$0</b></span>
        </div>
      </div>

      <div class="live-pill" title="실시간 연결 상태" role="status">
        <span class="status-dot"></span>
        <span id="sseStatusText">연결 중</span>
      </div>

      <!-- 오른쪽 도구 버튼 -->
      <div class="stage-tools" role="group" aria-label="보기 도구">
        <button type="button" class="tool-btn" id="btnZoomIn" aria-label="확대" title="확대">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button type="button" class="tool-btn" id="btnZoomOut" aria-label="축소" title="축소">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button type="button" class="tool-btn" id="btnFit" aria-label="화면에 맞추기" title="화면에 맞추기 (더블클릭)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        </button>
        <button type="button" class="tool-btn" id="btnNight" aria-label="낮/밤 전환" title="낮/밤 전환">
          <span id="nightIcon"></span>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button type="button" class="tool-btn" id="btnToggleSound" title="효과음">
          <span id="soundIcon"></span><span class="btn-sound-text sr-only">효과음</span>
        </button>
        <button type="button" class="tool-btn" id="btnToggleNotify" title="데스크톱 알림">
          <span id="notifyIcon"></span><span class="sr-only" id="notifyText">알림</span>
        </button>
      </div>

      <!-- 에이전트 카드 -->
      <div class="stage-card agent-card" id="agentCard">
        <span class="agent-avatar" id="agentAvatar"><i></i></span>
        <div class="agent-card-body">
          <div class="agent-card-top">
            <span class="agent-name" id="agentName">에이전트</span>
            <span class="agent-status" id="agentStatusPill">대기 중</span>
          </div>
          <div class="agent-meta" id="agentMeta">도구 0회</div>
          <div class="agent-team" id="agentTeam"></div>
        </div>
      </div>
    </main>

    <!-- ============ 오른쪽: 업무 일지 ============ -->
    <aside class="journal" aria-label="업무 일지">
      <div class="journal-head">
        <h2>업무 일지</h2>
        <button type="button" class="journal-export" id="btnExportReport" title="업무 보고서를 마크다운으로 복사">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="btn-action-text">보고서 복사</span>
        </button>
      </div>
      <dl class="journal-meta">
        <dt>폴더</dt><dd id="journalFolder">-</dd>
        <dt>세션</dt><dd id="journalSession">-</dd>
        <dt>엔진</dt><dd id="journalEngine">-</dd>
      </dl>

      <div class="journal-state">
        <div class="journal-state-head">
          <span class="journal-section-title">지금 상태</span>
          <span class="state-badge state-IDLE" id="agentStateBadge">대기 중</span>
        </div>
        <div class="summary-text-box" id="agentStatusDetail">
          <div class="status-empty">최근 활동이 없습니다.</div>
        </div>
      </div>

      <div class="journal-section-title journal-log-title">기록</div>
      <div class="log-feed-box" id="eventLogFeed"></div>
    </aside>
  </div>

  <!-- 방 인스펙터 -->
  <div id="roomInspectorModal" class="inspector-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="inspectorTitle">
    <div class="inspector-backdrop" id="inspectorBackdrop"></div>
    <div class="inspector-dialog">
      <div class="inspector-header">
        <div class="inspector-title-wrap">
          <span class="inspector-icon" id="inspectorIcon"></span>
          <div>
            <h3 class="inspector-title" id="inspectorTitle">방 정보</h3>
            <div class="inspector-subtitle" id="inspectorSubtitle"></div>
          </div>
        </div>
        <button type="button" class="btn-inspector-close" id="btnInspectorClose" title="닫기 (Esc)" aria-label="닫기">✕</button>
      </div>
      <div class="inspector-body" id="inspectorBody"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="js/palette.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
